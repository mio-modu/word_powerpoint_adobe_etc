[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sojae"
version = "0.1.0"
description = "상품 사진 1장에서 규격별 한글 광고 소재를 대량 생성하는 엔진"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "requests>=2.31",
    "lxml>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
sojae = "sojae.cli:main"
gongmun = "gongmun.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
